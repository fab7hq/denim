<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 450" width="100%" height="auto">
  <defs>
    <!-- Background Grid Pattern -->
    <pattern id="grid-denim" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#161b22" stroke-width="1"/>
      <circle cx="0" cy="0" r="1.5" fill="#30363d" />
    </pattern>
    <!-- Glow Filters -->
    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="glow-indigo" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="glow-amber" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="glow-green" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Dark Background & Technical Blueprint Grid -->
  <rect width="1200" height="450" fill="#0d1117" rx="8"/>
  <rect width="1200" height="450" fill="url(#grid-denim)" rx="8"/>

  <!-- Outer Blueprint Frame -->
  <rect x="15" y="15" width="1170" height="420" fill="none" stroke="#30363d" stroke-width="1.5" stroke-dasharray="8 4" rx="4"/>
  <rect x="25" y="25" width="1150" height="400" fill="none" stroke="#21262d" stroke-width="1" rx="2"/>

  <!-- Header Technical Labels -->
  <text x="45" y="50" fill="#388bfd" font-family="monospace" font-size="12" font-weight="bold" letter-spacing="2">DENIM // DELEGATION SCHEMATIC</text>
  <text x="45" y="66" fill="#8b949e" font-family="monospace" font-size="10" letter-spacing="1">HOST CAPABILITY DELEGATION &amp; FAB7 PROVENANCE LOOM [DENIM-3]</text>

  <text x="980" y="50" fill="#3fb950" font-family="monospace" font-size="11" font-weight="bold" letter-spacing="1">STATE: SEALED (FAB7)</text>

  <!-- Left Side: Pattern Card Reader & Capability Discovery Deck -->
  <g transform="translate(60, 75)" opacity="0.95">
    <!-- Pattern Punch Card Deck (Capability Discovery Engine) -->
    <rect x="30" y="30" width="130" height="180" fill="none" stroke="#58a6ff" stroke-width="1.5" stroke-dasharray="4 2" rx="2"/>
    <text x="95" y="20" fill="#58a6ff" font-family="monospace" font-size="9" text-anchor="middle">PATTERN CARD READER</text>

    <!-- Punch Card Hole Grid (Host Advertised Capabilities) -->
    <!-- Row 1: Custom -->
    <circle cx="55" cy="50" r="4" fill="#388bfd"/>
    <circle cx="75" cy="50" r="4" fill="#388bfd"/>
    <circle cx="95" cy="50" r="4" fill="#388bfd"/>
    <circle cx="115" cy="50" r="4" fill="#388bfd"/>
    <circle cx="135" cy="50" r="4" fill="none" stroke="#8b949e"/>

    <!-- Row 2: Built-in -->
    <circle cx="55" cy="75" r="4" fill="none" stroke="#8b949e"/>
    <circle cx="75" cy="75" r="4" fill="#39c5bb"/>
    <circle cx="95" cy="75" r="4" fill="#39c5bb"/>
    <circle cx="115" cy="75" r="4" fill="none" stroke="#8b949e"/>
    <circle cx="135" cy="75" r="4" fill="#39c5bb"/>

    <!-- Row 3: Plugin -->
    <circle cx="55" cy="100" r="4" fill="#d29922"/>
    <circle cx="75" cy="100" r="4" fill="none" stroke="#8b949e"/>
    <circle cx="95" cy="100" r="4" fill="#d29922"/>
    <circle cx="115" cy="100" r="4" fill="#d29922"/>
    <circle cx="135" cy="100" r="4" fill="none" stroke="#8b949e"/>

    <!-- Row 4: Fallback -->
    <circle cx="55" cy="125" r="4" fill="none" stroke="#8b949e"/>
    <circle cx="75" cy="125" r="4" fill="#8b949e"/>
    <circle cx="95" cy="125" r="4" fill="none" stroke="#8b949e"/>
    <circle cx="115" cy="125" r="4" fill="#8b949e"/>
    <circle cx="135" cy="125" r="4" fill="#8b949e"/>

    <!-- Row 5: Ticket Seal -->
    <circle cx="55" cy="150" r="4" fill="#3fb950"/>
    <circle cx="75" cy="150" r="4" fill="#3fb950"/>
    <circle cx="95" cy="150" r="4" fill="#3fb950"/>
    <circle cx="115" cy="150" r="4" fill="#3fb950"/>
    <circle cx="135" cy="150" r="4" fill="#3fb950"/>

    <!-- Tension Regulator Wheels -->
    <circle cx="205" cy="70" r="18" fill="none" stroke="#8b949e" stroke-width="1.5"/>
    <circle cx="205" cy="70" r="6" fill="none" stroke="#58a6ff" stroke-width="1.5"/>

    <circle cx="205" cy="140" r="18" fill="none" stroke="#8b949e" stroke-width="1.5"/>
    <circle cx="205" cy="140" r="6" fill="none" stroke="#d29922" stroke-width="1.5"/>

    <!-- Thread Guidelines -->
    <path d="M 160 50 L 187 70 L 235 70" fill="none" stroke="#388bfd" stroke-width="1.5" filter="url(#glow-indigo)"/>
    <path d="M 160 100 L 187 140 L 235 140" fill="none" stroke="#d29922" stroke-width="1.5" filter="url(#glow-amber)"/>

    <!-- Annotations -->
    <line x1="160" y1="190" x2="235" y2="190" stroke="#8b949e" stroke-width="0.8" stroke-dasharray="2 2"/>
    <text x="15" y="225" fill="#8b949e" font-family="monospace" font-size="9">1A. CAPABILITY DISCOVERY &amp; THREAD TENSION</text>
  </g>

  <!-- Center: Delegation Weaving Matrix & Checkpoint Nodes -->
  <g transform="translate(320, 110)">
    <!-- Interlocking Denim Twill Weave Lines -->
    <path d="M 0 30 L 480 150" fill="none" stroke="#1f6beb" stroke-width="1.5" stroke-dasharray="8 4" opacity="0.6"/>
    <path d="M 0 50 L 480 170" fill="none" stroke="#388bfd" stroke-width="1.5" filter="url(#glow-indigo)"/>
    <path d="M 0 70 L 480 190" fill="none" stroke="#39c5bb" stroke-width="1.5" filter="url(#glow-cyan)"/>
    <path d="M 0 90 L 480 210" fill="none" stroke="#d29922" stroke-width="1.5" filter="url(#glow-amber)"/>

    <!-- Cross-Stitch Nodes (Asks & Seals) -->
    <g stroke="#f0f6fc" stroke-width="1.2">
      <!-- Ask 1: Custom -->
      <circle cx="60" cy="65" r="7" fill="#0d1117" stroke="#388bfd" stroke-width="2"/>
      <text x="60" y="68" fill="#58a6ff" font-family="monospace" font-size="8" font-weight="bold" text-anchor="middle">A1</text>

      <!-- Ask 2: Built-in -->
      <circle cx="160" cy="90" r="7" fill="#0d1117" stroke="#39c5bb" stroke-width="2"/>
      <text x="160" y="93" fill="#39c5bb" font-family="monospace" font-size="8" font-weight="bold" text-anchor="middle">A2</text>

      <!-- Ask 3: Plugin -->
      <circle cx="260" cy="115" r="7" fill="#0d1117" stroke="#d29922" stroke-width="2" filter="url(#glow-amber)"/>
      <text x="260" y="118" fill="#d29922" font-family="monospace" font-size="8" font-weight="bold" text-anchor="middle">A3</text>

      <!-- Ask 4: Fallback -->
      <circle cx="360" cy="140" r="7" fill="#0d1117" stroke="#388bfd" stroke-width="2"/>
      <text x="360" y="143" fill="#58a6ff" font-family="monospace" font-size="8" font-weight="bold" text-anchor="middle">A4</text>

      <!-- Fab7 Seal Node -->
      <polygon points="430,150 442,165 418,165" fill="#0d1117" stroke="#3fb950" stroke-width="2" filter="url(#glow-green)"/>
      <text x="430" y="180" fill="#3fb950" font-family="monospace" font-size="9" font-weight="bold" text-anchor="middle">SEAL</text>
    </g>

    <!-- Vertical Tension Lines -->
    <line x1="60" y1="20" x2="60" y2="130" stroke="#388bfd" stroke-width="0.8" stroke-dasharray="2 2"/>
    <line x1="160" y1="20" x2="160" y2="130" stroke="#39c5bb" stroke-width="0.8" stroke-dasharray="2 2"/>
    <line x1="260" y1="20" x2="260" y2="130" stroke="#d29922" stroke-width="0.8" stroke-dasharray="2 2"/>
    <line x1="360" y1="20" x2="360" y2="130" stroke="#388bfd" stroke-width="0.8" stroke-dasharray="2 2"/>
  </g>

  <!-- Right Side: Fabric Take-Up & Provenance Ledger Drum -->
  <g transform="translate(820, 80)" opacity="0.95">
    <!-- Harness Frames (Resolution Origins) -->
    <rect x="20" y="20" width="12" height="150" fill="none" stroke="#388bfd" stroke-width="1.5"/>
    <rect x="45" y="20" width="12" height="150" fill="none" stroke="#39c5bb" stroke-width="1.5"/>
    <rect x="70" y="20" width="12" height="150" fill="none" stroke="#d29922" stroke-width="1.5"/>

    <!-- Reed Wires -->
    <line x1="100" y1="30" x2="100" y2="160" stroke="#8b949e" stroke-width="1"/>
    <line x1="104" y1="30" x2="104" y2="160" stroke="#8b949e" stroke-width="1"/>
    <line x1="108" y1="30" x2="108" y2="160" stroke="#8b949e" stroke-width="1"/>

    <!-- Fabric Take-Up Roller (Sealed Fab7 Batch Provenance Ledger) -->
    <ellipse cx="220" cy="95" rx="32" ry="60" fill="none" stroke="#388bfd" stroke-width="2" filter="url(#glow-indigo)"/>
    <ellipse cx="220" cy="95" rx="14" ry="26" fill="none" stroke="#8b949e" stroke-width="1.5"/>
    <line x1="220" y1="35" x2="275" y2="35" stroke="#30363d" stroke-width="1.5"/>
    <line x1="220" y1="155" x2="275" y2="155" stroke="#30363d" stroke-width="1.5"/>
    <path d="M 275 35 A 60 60 0 0 1 275 155" fill="none" stroke="#3fb950" stroke-width="1.5" filter="url(#glow-green)"/>

    <!-- Annotations -->
    <line x1="50" y1="175" x2="50" y2="195" stroke="#8b949e" stroke-width="0.8" stroke-dasharray="2 2"/>
    <text x="15" y="208" fill="#8b949e" font-family="monospace" font-size="9">2A. HEALD HARNESS &amp; REED</text>

    <line x1="220" y1="160" x2="220" y2="195" stroke="#8b949e" stroke-width="0.8" stroke-dasharray="2 2"/>
    <text x="180" y="208" fill="#8b949e" font-family="monospace" font-size="9">2B. FAB7 PROVENANCE LEDGER</text>
  </g>

  <!-- Separate Bottom Branding Bar (Zero Overlap with Drawing) -->
  <g transform="translate(45, 305)">
    <!-- Divider Line -->
    <line x1="0" y1="0" x2="1110" y2="0" stroke="#30363d" stroke-width="1.5" stroke-dasharray="6 3"/>

    <!-- Title & Tagline at the Very Bottom -->
    <text x="555" y="45" fill="#f0f6fc" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="900" letter-spacing="8" text-anchor="middle" filter="url(#glow-indigo)">DENIM</text>
    <text x="555" y="72" fill="#58a6ff" font-family="monospace" font-size="13" font-weight="600" letter-spacing="4" text-anchor="middle">FAB7 PRODUCT EXTENSION // HOST DELEGATION MECHANISM</text>
    <text x="555" y="94" fill="#8b949e" font-family="monospace" font-size="11" letter-spacing="2" text-anchor="middle">DISCOVERY // RESOLUTION // DELEGATION // CAPTURE // CHECKPOINT // SEAL // PROVENANCE</text>
  </g>
</svg>
